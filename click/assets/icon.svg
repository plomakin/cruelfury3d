  <line x1="114" y1="168" x2="114" y2="188" stroke="#19082b" stroke-width="5"/>
  <line x1="128" y1="168" x2="128" y2="188" stroke="#19082b" stroke-width="5"/>
  <line x1="142" y1="168" x2="142" y2="188" stroke="#19082b" stroke-width="5"/>
