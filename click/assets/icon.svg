  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="10" y="10" width="236" height="236" rx="46" fill="none" stroke="url(#neonPink)" stroke-width="6"/>
  <!-- Crosshair ring -->
  <circle cx="128" cy="126" r="84" fill="none" stroke="#28f7ff" stroke-width="5" stroke-dasharray="32 14" opacity="0.85"/>
  <line x1="128" y1="24" x2="128" y2="54" stroke="#28f7ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="128" y1="198" x2="128" y2="228" stroke="#28f7ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="26" y1="126" x2="56" y2="126" stroke="#28f7ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="126" x2="230" y2="126" stroke="#28f7ff" stroke-width="6" stroke-linecap="round"/>
  <!-- Cyber Skull + Mohawk + Visor -->
